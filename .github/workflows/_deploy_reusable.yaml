name: DEPLOY

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster:
        required: true
        type: string
      service:
        required: true
        type: string
      image-tag:
        required: true
        type: string
    secrets:
      DEPLOY_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mi-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      previous-task-def: ${{ steps.current.outputs.task-def-arn }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Task actual
        id: current
        run: |
          CURRENT_ARN=$(aws ecs describe-services \
            --cluster ${{ inputs.cluster }} \
            --services ${{ inputs.service }} \
            --query 'services[0].taskDefinition' -o text)
          echo "task-def-arn=$CURRENT_ARN" >> "$GITHUB_OUTPUT"

      - name: Descargar task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ inputs.service }} \
            --query 'taskDefinition' > task-definition.json

      - name: Insertar imagen
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: mi-app
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image-tag }}

      - name: Deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.service }}
          cluster: ${{ inputs.cluster }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  rollback:
    needs: [deploy]
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: |
          aws ecs update-service \
            --cluster ${{ inputs.cluster }} \
            --service ${{ inputs.service }} \
            --task-definition ${{ needs.deploy.outputs.previous-task-def }} \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ inputs.cluster }} \
            --services ${{ inputs.service }}